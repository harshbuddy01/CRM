version: '3.8'

services:
  # --- Database (PostgreSQL) ---
  postgres:
    image: postgres:15-alpine
    container_name: crm-postgres
    restart: always
    environment:
      POSTGRES_DB: railway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crm-network

  # --- Cache & BullMQ Queue (Redis) ---
  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - crm-network

  # --- Instant Search (Meilisearch) ---
  meilisearch:
    image: getmeili/meilisearch:v1.9.0
    container_name: crm-meilisearch
    restart: always
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
    volumes:
      - meili_data:/meili_data
    networks:
      - crm-network

  # --- S3 Object Storage (MinIO) ---
  minio:
    image: minio/minio
    container_name: crm-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - crm-network

  # --- TravelCRM Backend (API + Worker) ---
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: crm-backend
    restart: always
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      VAULT_ENDPOINT: http://minio:9000
    networks:
      - crm-network

  # --- Automation Platform (n8n) ---
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: crm-n8n
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=railway
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    depends_on:
      - postgres
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - crm-network

  # --- Reverse Proxy with SSL (Caddy) ---
  caddy:
    image: caddy:2-alpine
    container_name: crm-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - minio
      - meilisearch
      - n8n
    networks:
      - crm-network

volumes:
  postgres_data:
  redis_data:
  meili_data:
  minio_data:
  n8n_data:
  caddy_data:
  caddy_config:

networks:
  crm-network:
    driver: bridge
