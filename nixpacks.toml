# ============================================================
# TravelCRM — Railway/Nixpacks Configuration
# ============================================================
# This file ensures that system-level dependencies for Chromium
# are installed on Railway so that PDF generation works.
# ============================================================

[phases.setup]
aptPkgs = [
  "libnss3",
  "libnspr4",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "libxss1"
]
