name: Smart CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  # --- 1. Detect Which Part of Code Changed ---
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.mjs'
              - 'tailwind.config.ts'
              - 'tsconfig.json'
            backend:
              - 'backend/**'
              - 'deployment/**'

  # --- 2. Build & Deploy Frontend (ONLY if Frontend Files Changed) ---
  deploy-frontend:
    name: Deploy Frontend to Hostinger
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Next.js Build Output
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Build Next.js App
        env:
          NEXT_PUBLIC_APP_NAME: "StreamKart"
          NEXT_PUBLIC_APP_DOMAIN: "streamkart.shop"
          NEXT_PUBLIC_API_URL: "https://api.streamkart.shop/api/v1"
          NEXT_PUBLIC_SUPPORT_EMAIL: "support@streamkart.shop"
        run: npm run build

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: "187.127.161.30"
          username: "u255161845"
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          local-dir: ./out/
          server-dir: /domains/streamkart.shop/public_html/
          dangerous-clean-slate: false

  # --- 3. Deploy Backend (ONLY if Backend Files Changed) ---
  deploy-backend:
    name: Deploy Backend to GCP VM
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "35.234.218.146"
          username: "anandharsh437"
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd ~/travelcrm
            git pull origin main
            cd deployment/gcp
            docker compose up -d --build backend
            docker image prune -f
